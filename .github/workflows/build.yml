name: Build Firmware

# Compile-only sanity check: every push and PR that touches the sketch must
# still build. This does not publish anything - see release.yml for the
# workflow that actually ships an OTA update.
on:
  push:
    branches: ["**"]
    paths:
      - "firmware/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up arduino-cli
        uses: arduino/setup-arduino-cli@v2.0.0

      - name: Install ESP32 board core
        run: |
          arduino-cli core update-index \
            --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32 \
            --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Install libraries
        run: arduino-cli lib install ArduinoJson

      - name: Compile sketch
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,CDCOnBoot=cdc" \
            firmware/StackWallet
